<div id="log" class="log">
  <h3>Wat gebeurt er?</h3>
  {% for r in log %}
  <div class="logregel {{ r.soort }}{% if r.mij %} mij{% endif %}{% if loop.first %} nieuw{% endif %}"><span class="tijd">{{ r.tijd }}</span>{{ r.tekst }}</div>
  {% else %}
  <div class="logregel leeg">Typ een commando om te beginnen.</div>
  {% endfor %}
</div>
